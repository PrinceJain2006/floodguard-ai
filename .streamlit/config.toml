[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1a1d27"
textColor = "#e2e8f0"
font = "sans serif"

[server]
# IBM Cloud Code Engine provides PORT env var — read dynamically in start.sh
# headless=true required for containerised/cloud deployment
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
